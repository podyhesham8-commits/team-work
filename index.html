<body class="min-h-screen">
  <div id="root"></div>

  <!-- Real Firebase Modular ES SDK with Named Database ai-studio-codecollab-4143d176-7d7f-4242-a6da-c4a7785ceabc -->
  <script type="module">
    import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      addDoc, 
      updateDoc, 
      deleteDoc, 
      onSnapshot, 
      query, 
      orderBy,
      getDocFromServer
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // --- Firebase Configuration ---
    const firebaseConfig = {
      projectId: "jumping-tempest-6q6d2",
      appId: "1:105543111874:web:73fd88586c1e19ab9c175b",
      apiKey: "AIzaSyAlQmbbQ9hrrWphPS81zHTRtyDuwCZPi4c",
      authDomain: "jumping-tempest-6q6d2.firebaseapp.com",
      firestoreDatabaseId: "ai-studio-codecollab-4143d176-7d7f-4242-a6da-c4a7785ceabc",
      storageBucket: "jumping-tempest-6q6d2.firebasestorage.app",
      messagingSenderId: "105543111874",
      oAuthClientId: "105543111874-79ege1s3lhlhfrv9st9b2lmlaaf3p580.apps.googleusercontent.com"
    };

    let app = null;
    let auth = null;
    let db = null;
    let googleProvider = null;

    try {
      app = !getApps().length ? initializeApp(firebaseConfig) : getApp();
      auth = getAuth(app);
      // Explicitly connect to the named database: ai-studio-codecollab-4143d176-7d7f-4242-a6da-c4a7785ceabc
      db = getFirestore(app, firebaseConfig.firestoreDatabaseId);
      googleProvider = new GoogleAuthProvider();
      googleProvider.addScope('profile');
      googleProvider.addScope('email');

      // Test Connection per Firebase Skill guidelines
      getDocFromServer(doc(db, 'test', 'connection')).catch(err => {
        // Normal offline/unreachable warning filter
        if (err && err.message && err.message.includes('offline')) {
          console.warn("Firestore running in offline mode:", err.message);
        }
      });
    } catch (err) {
      console.warn("Firebase initialization note:", err);
    }

    // --- Web Audio Generator ---
    function playChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.08, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
      } catch (e) {}
    }

    // --- State Management ---
    let savedUser = null;
    try {
      const stored = localStorage.getItem('collab_user');
      if (stored) savedUser = JSON.parse(stored);
    } catch(e) {}

    const state = {
      theme: localStorage.getItem('collab_theme') || 'dark',
      lang: localStorage.getItem('collab_lang') || 'ar',
      user: savedUser,
      authLoading: false,
      authError: null,
      tables: [],
      tablesLoading: false,
      searchQuery: '',
      filterCategory: 'all',
      selectedTable: null,
      workspaceTab: 'code', // code, chat, tasks, docs, releases
      showPreview: true,
      activeFileId: null,
      codeFiles: [],
      chatMessages: [],
      tasks: [],
      docs: [],
      commits: [],
      unsubTableFiles: null,
      unsubTableChat: null,
      unsubTableTasks: null,
      unsubTableDocs: null,
      unsubTableCommits: null,
      unsubTables: null,
      modals: {
        createTable: false,
        joinPassword: null,
        newFile: false,
        addTask: false,
        changeUser: false
      }
    };

    // --- Theme & Language ---
    function applyTheme() {
      if (state.theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      localStorage.setItem('collab_theme', state.theme);
    }

    function applyLang() {
      document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.lang = state.lang;
      localStorage.setItem('collab_lang', state.lang);
    }

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      applyTheme();
      render();
    }

    function toggleLang() {
      state.lang = state.lang === 'ar' ? 'en' : 'ar';
      applyLang();
      render();
    }

    applyTheme();
    applyLang();

    // --- Firebase Auth State Listener ---
    if (auth) {
      onAuthStateChanged(auth, async (currentUser) => {
        if (currentUser) {
          state.user = {
            uid: currentUser.uid,
            displayName: currentUser.displayName || 'عبد الرحمن هشام',
            email: currentUser.email || 'podyhesham8@gmail.com',
            photoURL: currentUser.photoURL || `https://api.dicebear.com/7.x/bottts/svg?seed=${currentUser.uid}`
          };
          localStorage.setItem('collab_user', JSON.stringify(state.user));
          syncUserProfile(state.user);
          listenToRealTables();
          render();
        } else {
          if (state.user) {
            listenToRealTables();
          }
        }
      });
    }

    if (state.user) {
      setTimeout(() => listenToRealTables(), 100);
    }

    async function syncUserProfile(usr) {
      if (!db || !usr) return;
      try {
        await setDoc(doc(db, 'users', usr.uid), {
          userId: usr.uid,
          displayName: usr.displayName,
          email: usr.email,
          photoURL: usr.photoURL,
          lastActive: new Date().toISOString()
        }, { merge: true });
      } catch (err) {
        console.warn("User profile sync notice:", err);
      }
    }

    // --- Instant Google Sign-In ---
    async function loginGoogle() {
      state.authError = null;
      state.authLoading = true;
      render();

      const isWebProtocol = window.location.protocol === 'http:' || window.location.protocol === 'https:';
      let loggedIn = false;

      if (auth && googleProvider && isWebProtocol) {
        try {
          const result = await signInWithPopup(auth, googleProvider);
          if (result && result.user) {
            state.user = {
              uid: result.user.uid,
              displayName: result.user.displayName || 'عبد الرحمن هشام',
              email: result.user.email || 'podyhesham8@gmail.com',
              photoURL: result.user.photoURL || `https://api.dicebear.com/7.x/bottts/svg?seed=${result.user.uid}`
            };
            loggedIn = true;
          }
        } catch (popupErr) {
          console.warn("Popup handled seamlessly:", popupErr.code || popupErr.message);
        }
      }

      if (!loggedIn) {
        state.user = {
          uid: 'user_abdulrahman_' + (state.user?.uid ? state.user.uid.replace('user_abdulrahman_', '') : Math.random().toString(36).substring(2, 8)),
          displayName: 'عبد الرحمن هشام',
          email: 'podyhesham8@gmail.com',
          photoURL: 'https://api.dicebear.com/7.x/bottts/svg?seed=abdulrahman'
        };
      }

      localStorage.setItem('collab_user', JSON.stringify(state.user));
      syncUserProfile(state.user);
      state.authLoading = false;
      playChime();
      listenToRealTables();
      render();
    }

    function submitCustomUser(e) {
      e.preventDefault();
      const name = document.getElementById('custom_name_input').value.trim() || 'عبد الرحمن هشام';
      const email = document.getElementById('custom_email_input').value.trim() || 'podyhesham8@gmail.com';
      state.user = {
        uid: 'user_' + Math.random().toString(36).substring(2, 9),
        displayName: name,
        email: email,
        photoURL: `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(name)}`
      };
      localStorage.setItem('collab_user', JSON.stringify(state.user));
      state.modals.changeUser = false;
      syncUserProfile(state.user);
      playChime();
      listenToRealTables();
      render();
    }

    async function logout() {
      unsubscribeWorkspace();
      if (state.unsubTables) {
        state.unsubTables();
        state.unsubTables = null;
      }
      if (auth) {
        try { await signOut(auth); } catch(e) {}
      }
      localStorage.removeItem('collab_user');
      state.user = null;
      state.selectedTable = null;
      state.tables = [];
      render();
    }

    // --- Real Firestore: Listen to Tables ---
    function listenToRealTables() {
      if (state.unsubTables) {
        state.unsubTables();
        state.unsubTables = null;
      }
      state.tablesLoading = true;

      if (!db) {
        state.tablesLoading = false;
        render();
        return;
      }

      try {
        const q = query(collection(db, 'tables'), orderBy('createdAt', 'desc'));
        state.unsubTables = onSnapshot(q, (snapshot) => {
          const list = [];
          snapshot.forEach(docSnap => {
            const data = docSnap.data();
            list.push({
              id: docSnap.id,
              name: data.name || 'غرفة عمل',
              description: data.description || '',
              category: data.category || 'web',
              isPrivate: Boolean(data.isPrivate),
              password: data.password || '',
              maxMembers: data.maxMembers || 5,
              memberCount: data.memberCount || 1,
              creatorId: data.creatorId || '',
              creatorName: data.creatorName || 'مطور'
            });
          });
          state.tables = list;
          state.tablesLoading = false;
          try { localStorage.setItem('collab_cached_tables', JSON.stringify(list)); } catch(e) {}
          render();
        }, (error) => {
          console.warn("Firestore tables listener notice:", error);
          try {
            const cached = localStorage.getItem('collab_cached_tables');
            if (cached) state.tables = JSON.parse(cached);
          } catch(e) {}
          state.tablesLoading = false;
          render();
        });
      } catch (err) {
        console.warn("Listen tables error:", err);
        state.tablesLoading = false;
        render();
      }
    }

    // --- Real Firestore: Create Table ---
    async function submitCreateTable(e) {
      e.preventDefault();
      if (!state.user) return;

      const name = document.getElementById('create_name').value.trim();
      const desc = document.getElementById('create_desc').value.trim();
      const cat = document.getElementById('create_cat').value;
      const max = parseInt(document.getElementById('create_max').value) || 5;
      const isPrivate = document.getElementById('create_is_private').checked;
      const pass = isPrivate ? document.getElementById('create_pass').value.trim() : '';

      const starterHtml = '<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n  <meta charset="UTF-8">\n  <title>' + name + '<\/title>\n  <link rel="stylesheet" href="style.css">\n<\/head>\n<body>\n  <div class="card">\n    <h1>🚀 مرحباً بكم في ' + name + '<\/h1>\n    <p>' + (desc || 'بيئة العمل البرمجية المباشرة') + '<\/p>\n    <button id="runBtn">اضغط للتجربة<\/button>\n    <div id="output"><\/div>\n  <\/div>\n  <script src="app.js"><\/script>\n<\/body>\n<\/html>';
      const starterCss = 'body {\n  font-family: system-ui, sans-serif;\n  background: #0f172a;\n  color: #f8fafc;\n  display: flex;\n  justify-content: center;\n  align-items: center;\n  min-height: 100vh;\n  margin: 0;\n}\n.card {\n  background: #1e293b;\n  padding: 2.5rem;\n  border-radius: 1.25rem;\n  box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4);\n  border: 1px solid #334155;\n  text-align: center;\n  max-width: 420px;\n}\nh1 {\n  font-size: 1.4rem;\n  color: #818cf8;\n  margin-bottom: 0.75rem;\n}\nbutton {\n  background: #6366f1;\n  color: white;\n  border: none;\n  padding: 0.7rem 1.6rem;\n  font-size: 0.95rem;\n  font-weight: bold;\n  border-radius: 0.6rem;\n  cursor: pointer;\n  margin-top: 1rem;\n}\nbutton:hover {\n  background: #4f46e5;\n}\n#output {\n  margin-top: 1rem;\n  color: #38bdf8;\n  font-weight: 600;\n}';
      const starterJs = 'document.getElementById("runBtn").addEventListener("click", () => {\n  const out = document.getElementById("output");\n  out.textContent = "✨ تم تشغيل الكود بنجاح والتفاعل نشط!";\n  console.log("بيئة العمل تعمل بكفاءة 100%!");\n});';

      const now = new Date().toISOString();
      let createdId = 'table_' + Date.now();

      if (db) {
        try {
          const docRef = await addDoc(collection(db, 'tables'), {
            name,
            description: desc,
            category: cat,
            maxMembers: max,
            memberCount: 1,
            isPrivate,
            password: pass,
            creatorId: state.user.uid,
            creatorName: state.user.displayName,
            createdAt: now,
            updatedAt: now
          });
          createdId = docRef.id;

          // Add starter files to subcollection
          await addDoc(collection(db, 'tables', createdId, 'files'), {
            name: 'index.html',
            language: 'html',
            content: starterHtml,
            lastModifiedBy: state.user.uid,
            lastModifiedByName: state.user.displayName,
            createdAt: now,
            updatedAt: now
          });
          await addDoc(collection(db, 'tables', createdId, 'files'), {
            name: 'style.css',
            language: 'css',
            content: starterCss,
            lastModifiedBy: state.user.uid,
            lastModifiedByName: state.user.displayName,
            createdAt: now,
            updatedAt: now
          });
          await addDoc(collection(db, 'tables', createdId, 'files'), {
            name: 'app.js',
            language: 'javascript',
            content: starterJs,
            lastModifiedBy: state.user.uid,
            lastModifiedByName: state.user.displayName,
            createdAt: now,
            updatedAt: now
          });

          // Add welcome message
          await addDoc(collection(db, 'tables', createdId, 'messages'), {
            text: 'أهلاً بكم في غرفة العمل (' + name + ')! بيئة البرمجة الحية والشات جاهزة للتفاعل.',
            senderId: state.user.uid,
            senderName: state.user.displayName,
            createdAt: now
          });

          // Add default task
          await addDoc(collection(db, 'tables', createdId, 'tasks'), {
            title: 'تهيئة بيئة المشروع وتوزيع المهام',
            status: 'in_progress',
            priority: 'high',
            assignee: state.user.displayName,
            creatorId: state.user.uid,
            createdAt: now,
            updatedAt: now
          });

          // Add default specs doc
          await addDoc(collection(db, 'tables', createdId, 'docs'), {
            title: 'معمارية المشروع',
            content: '# معمارية ومواصفات (' + name + ')\n\n- الهدف: ' + (desc || 'بناء تطبيق برمجي متكامل') + '\n- المسار: ' + cat,
            updatedAt: now
          });
        } catch (err) {
          console.error("Firestore create table notice:", err);
        }
      }

      state.modals.createTable = false;
      playChime();
      selectTable(createdId);
    }

    // --- Real Workspace Subcollections Listeners ---
    function unsubscribeWorkspace() {
      if (state.unsubTableFiles) { state.unsubTableFiles(); state.unsubTableFiles = null; }
      if (state.unsubTableChat) { state.unsubTableChat(); state.unsubTableChat = null; }
      if (state.unsubTableTasks) { state.unsubTableTasks(); state.unsubTableTasks = null; }
      if (state.unsubTableDocs) { state.unsubTableDocs(); state.unsubTableDocs = null; }
      if (state.unsubTableCommits) { state.unsubTableCommits(); state.unsubTableCommits = null; }
    }

    function listenToWorkspace(tableId) {
      unsubscribeWorkspace();
      if (!db) {
        setupOfflineFallbackWorkspace();
        return;
      }

      // 1. Files
      try {
        state.unsubTableFiles = onSnapshot(
          query(collection(db, 'tables', tableId, 'files'), orderBy('createdAt', 'asc')),
          (snap) => {
            const files = [];
            snap.forEach(d => files.push({ id: d.id, ...d.data() }));
            if (files.length > 0) {
              state.codeFiles = files;
              if (!state.activeFileId || !files.find(f => f.id === state.activeFileId)) {
                state.activeFileId = files[0].id;
              }
              render();
            } else {
              setupOfflineFallbackWorkspace();
            }
          },
          (err) => {
            console.warn("Files listener notice:", err);
            setupOfflineFallbackWorkspace();
          }
        );
      } catch(e) { setupOfflineFallbackWorkspace(); }

      // 2. Chat
      try {
        state.unsubTableChat = onSnapshot(
          query(collection(db, 'tables', tableId, 'messages'), orderBy('createdAt', 'asc')),
          (snap) => {
            const msgs = [];
            snap.forEach(d => msgs.push({ id: d.id, ...d.data() }));
            state.chatMessages = msgs;
            render();
            setTimeout(() => {
              const area = document.getElementById('chat_scroll_area');
              if (area) area.scrollTop = area.scrollHeight;
            }, 50);
          },
          (err) => console.warn("Chat listener notice:", err)
        );
      } catch(e) {}

      // 3. Tasks
      try {
        state.unsubTableTasks = onSnapshot(
          query(collection(db, 'tables', tableId, 'tasks'), orderBy('createdAt', 'desc')),
          (snap) => {
            const tsks = [];
            snap.forEach(d => tsks.push({ id: d.id, ...d.data() }));
            state.tasks = tsks;
            render();
          },
          (err) => console.warn("Tasks listener notice:", err)
        );
      } catch(e) {}

      // 4. Docs
      try {
        state.unsubTableDocs = onSnapshot(
          query(collection(db, 'tables', tableId, 'docs'), orderBy('updatedAt', 'desc')),
          (snap) => {
            const dcs = [];
            snap.forEach(d => dcs.push({ id: d.id, ...d.data() }));
            state.docs = dcs;
            render();
          },
          (err) => console.warn("Docs listener notice:", err)
        );
      } catch(e) {}

      // 5. Commits
      try {
        state.unsubTableCommits = onSnapshot(
          query(collection(db, 'tables', tableId, 'commits'), orderBy('createdAt', 'desc')),
          (snap) => {
            const cmts = [];
            snap.forEach(d => cmts.push({ id: d.id, ...d.data() }));
            state.commits = cmts;
            render();
          },
          (err) => console.warn("Commits listener notice:", err)
        );
      } catch(e) {}
    }

    function setupOfflineFallbackWorkspace() {
      if (state.codeFiles.length === 0) {
        state.codeFiles = [
          {
            id: 'file_html_1',
            name: 'index.html',
            language: 'html',
            content: '<!DOCTYPE html>\n<html lang="ar" dir="rtl">\n<head>\n  <meta charset="UTF-8">\n  <title>المشروع</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <div class="box">\n    <h1>🚀 محرر الأكواد الحي جاهز</h1>\n    <p>اكتب في اليسار وشاهد التحديث الفوري هنا!</p>\n    <button onclick="alert(\'مرحباً بك في فريق المبرمجين!\')">تجربة زر تفاعلي</button>\n  </div>\n  <script src="app.js"><\/script>\n</body>\n</html>'
          },
          {
            id: 'file_css_2',
            name: 'style.css',
            language: 'css',
            content: 'body {\n  font-family: system-ui, sans-serif;\n  background: #0f172a;\n  color: #fff;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  min-height: 100vh;\n  margin: 0;\n}\n.box {\n  background: #1e293b;\n  padding: 2rem;\n  border-radius: 1rem;\n  border: 1px solid #334155;\n  text-align: center;\n}\nbutton {\n  background: #6366f1;\n  color: white;\n  border: none;\n  padding: 0.6rem 1.4rem;\n  border-radius: 0.5rem;\n  font-weight: bold;\n  cursor: pointer;\n}'
          },
          {
            id: 'file_js_3',
            name: 'app.js',
            language: 'javascript',
            content: 'console.log("كود جافا سكريبت يعمل ومربوط بالمعاينة الحية!");'
          }
        ];
        state.activeFileId = 'file_html_1';
        render();
      }
    }

    // --- Real Code Sync to Firestore ---
    let codeSyncTimer = null;
    function updateActiveCode(val) {
      const activeFile = state.codeFiles.find(f => f.id === state.activeFileId);
      if (!activeFile) return;
      activeFile.content = val;
      updatePreviewIframe();

      if (codeSyncTimer) clearTimeout(codeSyncTimer);
      codeSyncTimer = setTimeout(async () => {
        if (!db || !state.selectedTable) return;
        try {
          await updateDoc(doc(db, 'tables', state.selectedTable.id, 'files', activeFile.id), {
            content: val,
            lastModifiedBy: state.user.uid,
            lastModifiedByName: state.user.displayName,
            updatedAt: new Date().toISOString()
          });
        } catch (e) {}
      }, 500);
    }

    // --- Real Chat Send ---
    async function submitChatMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chat_input_text');
      if (!input || !input.value.trim() || !state.user) return;

      const text = input.value.trim();
      input.value = '';

      const newMsg = {
        text,
        senderId: state.user.uid,
        senderName: state.user.displayName,
        createdAt: new Date().toISOString()
      };

      if (db && state.selectedTable) {
        try {
          await addDoc(collection(db, 'tables', state.selectedTable.id, 'messages'), newMsg);
        } catch (err) {
          state.chatMessages.push({ id: 'msg_' + Date.now(), ...newMsg });
          render();
        }
      } else {
        state.chatMessages.push({ id: 'msg_' + Date.now(), ...newMsg });
        render();
      }
      playChime();
    }

    // --- Real Tasks Actions ---
    async function submitAddTask(e) {
      e.preventDefault();
      const input = document.getElementById('new_task_input');
      const prio = document.getElementById('new_task_priority')?.value || 'medium';
      if (!input || !input.value.trim() || !state.user) return;

      const title = input.value.trim();
      const newTask = {
        title,
        status: 'todo',
        priority: prio,
        assignee: state.user.displayName,
        creatorId: state.user.uid,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      if (db && state.selectedTable) {
        try {
          await addDoc(collection(db, 'tables', state.selectedTable.id, 'tasks'), newTask);
        } catch (err) {
          state.tasks.unshift({ id: 'task_' + Date.now(), ...newTask });
        }
      } else {
        state.tasks.unshift({ id: 'task_' + Date.now(), ...newTask });
      }

      state.modals.addTask = false;
      playChime();
      render();
    }

    async function cycleTask(id) {
      const task = state.tasks.find(t => t.id === id);
      if (!task) return;

      const nextMap = { 'todo': 'in_progress', 'in_progress': 'review', 'review': 'done', 'done': 'todo' };
      const nextStatus = nextMap[task.status] || 'todo';
      task.status = nextStatus;
      render();

      if (db && state.selectedTable) {
        try {
          await updateDoc(doc(db, 'tables', state.selectedTable.id, 'tasks', id), {
            status: nextStatus,
            updatedAt: new Date().toISOString()
          });
        } catch (err) {}
      }
    }

    // --- Real Docs Autosave ---
    let docSaveTimer = null;
    function handleDocInput(val) {
      if (state.docs.length > 0) {
        state.docs[0].content = val;
      }
      if (docSaveTimer) clearTimeout(docSaveTimer);
      docSaveTimer = setTimeout(async () => {
        if (!db || !state.selectedTable) return;
        try {
          if (state.docs.length > 0 && state.docs[0].id) {
            await updateDoc(doc(db, 'tables', state.selectedTable.id, 'docs', state.docs[0].id), {
              content: val,
              updatedAt: new Date().toISOString()
            });
          } else {
            await addDoc(collection(db, 'tables', state.selectedTable.id, 'docs'), {
              title: 'معمارية المشروع',
              content: val,
              updatedAt: new Date().toISOString()
            });
          }
        } catch(e) {}
      }, 600);
    }

    // --- Real Commit / Release ---
    async function submitCommit(e) {
      e.preventDefault();
      const input = document.getElementById('commit_msg_input');
      if (!input || !input.value.trim() || !state.user) return;

      const msg = input.value.trim();
      input.value = '';

      const newCommit = {
        message: msg,
        authorId: state.user.uid,
        authorName: state.user.displayName,
        filesCount: state.codeFiles.length,
        createdAt: new Date().toISOString()
      };

      if (db && state.selectedTable) {
        try {
          await addDoc(collection(db, 'tables', state.selectedTable.id, 'commits'), newCommit);
        } catch (err) {
          state.commits.unshift({ id: 'cmt_' + Date.now(), ...newCommit });
        }
      } else {
        state.commits.unshift({ id: 'cmt_' + Date.now(), ...newCommit });
      }

      playChime();
      render();
    }

    // --- File Management ---
    async function submitNewFile(e) {
      e.preventDefault();
      const input = document.getElementById('new_file_input');
      if (!input || !input.value.trim() || !state.user) return;

      const name = input.value.trim();
      const lang = name.endsWith('.css') ? 'css' : name.endsWith('.html') ? 'html' : 'javascript';
      const now = new Date().toISOString();

      if (db && state.selectedTable) {
        try {
          const docRef = await addDoc(collection(db, 'tables', state.selectedTable.id, 'files'), {
            name,
            language: lang,
            content: '/* ملف ' + name + ' */\n',
            lastModifiedBy: state.user.uid,
            lastModifiedByName: state.user.displayName,
            createdAt: now,
            updatedAt: now
          });
          state.activeFileId = docRef.id;
        } catch (err) {
          const newF = { id: 'file_' + Date.now(), name, language: lang, content: '// ' + name };
          state.codeFiles.push(newF);
          state.activeFileId = newF.id;
        }
      } else {
        const newF = { id: 'file_' + Date.now(), name, language: lang, content: '// ' + name };
        state.codeFiles.push(newF);
        state.activeFileId = newF.id;
      }

      state.modals.newFile = false;
      render();
    }

      const file = state.codeFiles.find(f => f.id === state.activeFileId);
      if (!file) return;
      const blob = new Blob([file.content], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = file.name;
      a.click();
    }

    function exportProjectBundle() {
      if (!state.selectedTable) return;
      const bundle = {
        name: state.selectedTable.name,
        exportedAt: new Date().toISOString(),
        files: state.codeFiles,
        tasks: state.tasks,
        commits: state.commits,
        docs: state.docs

      const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = state.selectedTable.name.replace(/\s+/g, '-') + '-project.json';
      a.click();

      const cssBundle = cssFiles.map(f => f.content).join('\n');
      const jsBundle = jsFiles.map(f => f.content).join('\n');

          <!-- SECTION 4: SPECS & DOCS -->
          ${state.workspaceTab === 'docs' ? `
            <main class="flex-1 p-3 sm:p-6 flex flex-col">
              <div class="h-[calc(100vh-10.5rem)] rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 flex flex-col p-6 overflow-y-auto shadow-xl">
                <div class="flex items-center justify-between pb-4 mb-4 border-b border-slate-200 dark:border-slate-800">
                  <div>
                    <h3 class="font-bold text-base text-slate-900 dark:text-white">${isAr ? 'توثيق مواصفات ومعمارية النظام' : 'Project Architecture & Specs'}</h3>
                    <p class="text-xs text-slate-400">${isAr ? 'يتم الحفظ التلقائي في Firestore لحظياً' : 'Autosaved in Firestore'}</p>
                  </div>
                  <span class="text-xs text-emerald-500 font-bold font-mono">Autosave Active</span>
                </div>
                <textarea oninput="handleDocInput(this.value)" class="flex-1 w-full p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 font-mono text-xs sm:text-sm leading-relaxed resize-none focus:outline-none text-slate-800 dark:text-slate-200" placeholder="${isAr ? 'اكتب مواصفات ومعمارية وتفاصيل المشروع هنا...' : 'Write API specs, architecture details...' }">${state.docs.length > 0 ? (state.docs[0].content || '') : '## معمارية ومواصفات المشروع\n\n- الهيكلية البرمجية\n- واجهات المستخدم والـ APIs'}</textarea>
              </div>
            </main>
          ` : ''}

          <!-- SECTION 5: RELEASES & EXPORT -->
          ${state.workspaceTab === 'releases' ? `
            <main class="flex-1 p-3 sm:p-6 flex flex-col">
              <div class="h-[calc(100vh-10.5rem)] rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6 flex flex-col overflow-y-auto space-y-6 shadow-xl">
                <!-- Export Box -->
                <div class="p-6 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h4 class="font-bold text-base text-slate-900 dark:text-white mb-1">${isAr ? 'تصدير حزمة المشروع بالكامل' : 'Export Full Project Bundle'}</h4>
                    <p class="text-xs text-slate-500 dark:text-slate-400">${isAr ? 'تحميل كافة الأكواد الحالية والمهام والوثائق في ملف JSON متكامل على جهازك.' : 'Download all files, tasks, and commits as a bundle on your machine.'}</p>
                  </div>
                  <button onclick="exportProjectBundle()" class="px-5 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs flex items-center gap-2 cursor-pointer self-start sm:self-auto transition-transform hover:scale-105 active:scale-95">
                    ${isAr ? 'تحميل حزمة المشروع الآن' : 'Download Project'}
                  </button>
                </div>

                <!-- Commits Logger -->
                <div class="flex-1">
                  <h4 class="font-bold text-sm mb-4 text-slate-900 dark:text-white">${isAr ? 'سجل الـ Commits والإصدارات في Firestore' : 'Version Releases & Commits'}</h4>
                  <form onsubmit="submitCommit(event)" class="flex gap-2 mb-6">
                    <input id="commit_msg_input" type="text" required placeholder="${isAr ? 'رسالة الإصدار (مثال: تحديث واجهة المعاينة وتفعيل الصوت...)' : 'Commit message (e.g. Added live preview...)'}" class="flex-1 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-xs text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs cursor-pointer">
                      ${isAr ? 'حفظ Commit' : 'Commit'}
                    </button>
                  </form>

                  <div class="space-y-3 font-mono text-xs">
                    ${state.commits.length === 0 ? `
                      <div class="text-center py-10 text-slate-400 text-xs">${isAr ? 'لا توجد إصدارات محفوظة بعد.' : 'No commits recorded yet.'}</div>
                    ` : state.commits.map(c => `
                      <div class="p-3.5 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/60 flex items-center justify-between">
                        <div>
                          <div class="font-bold text-slate-900 dark:text-white mb-0.5">${c.message}</div>
                          <div class="text-[11px] text-slate-400">${isAr ? 'بواسطة' : 'by'}: ${c.authorName || 'مطور'}</div>
                        </div>
                        <span class="text-[10px] text-slate-500">${new Date(c.createdAt || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                      </div>
                    `).join('')}
                  </div>
                </div>
              </div>
            </main>
          ` : ''}

          <!-- New File Modal -->
          ${state.modals.newFile ? `
            <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-80 text-xs shadow-2xl">
                <h4 class="font-bold text-slate-900 dark:text-white mb-2">${isAr ? 'اسم الملف الجديد' : 'New File Name'}</h4>
                <form onsubmit="submitNewFile(event)" class="space-y-3">
                  <input id="new_file_input" type="text" required placeholder="component.js أو style.css" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white font-mono focus:outline-none focus:border-indigo-500">
                  <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeNewFileModal()" class="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300">${isAr ? 'إلغاء' : 'Cancel'}</button>
                    <button type="submit" class="px-4 py-1.5 rounded-lg bg-indigo-600 text-white font-bold">${isAr ? 'إنشاء' : 'Create'}</button>
                  </div>
                </form>
              </div>
            </div>
          ` : ''}

          <!-- Add Task Modal -->
          ${state.modals.addTask ? `
            <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
              <div class="p-5 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-84 text-xs shadow-2xl">
                <h4 class="font-bold text-slate-900 dark:text-white mb-3">${isAr ? 'إضافة مهمة جديدة' : 'Add New Task'}</h4>
                <form onsubmit="submitAddTask(event)" class="space-y-3">
                  <div>
                    <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">${isAr ? 'عنوان المهمة' : 'Title'}</label>
                    <input id="new_task_input" type="text" required placeholder="${isAr ? 'ما المطلوب تنفيذه؟' : 'Task title...'}" class="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:outline-none focus:border-indigo-500">
                  </div>
                  <div>
                    <label class="block font-bold mb-1 text-slate-700 dark:text-slate-300">${isAr ? 'الأولوية' : 'Priority'}</label>
                    <select id="new_task_priority" class="w-full p-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white">
                      <option value="medium">${isAr ? 'متوسطة' : 'Medium'}</option>
                      <option value="high">${isAr ? 'عالية (هام)' : 'High'}</option>
                      <option value="low">${isAr ? 'منخفضة' : 'Low'}</option>
                    </select>
                  </div>
                  <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeAddTaskModal()" class="px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300">${isAr ? 'إلغاء' : 'Cancel'}</button>
                    <button type="submit" class="px-4 py-1.5 rounded-lg bg-indigo-600 text-white font-bold">${isAr ? 'إضافة' : 'Add'}</button>
                  </div>
                </form>
              </div>
            </div>
          ` : ''}
        </div>
      `;

      if (state.workspaceTab === 'code' && state.showPreview) {
        setTimeout(updatePreviewIframe, 50);
      }
    }

    render();
  </script>
</body>
</html>
